name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 构建
        run: go build -o zuzo.exe ./

      - name: Go 单测
        run: go test ./...

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: Python 语义对拍
        run: |
          python3 --version
          ./run_tests.sh

      - name: 混合语言 golden
        run: ./run_tests_mix.sh
