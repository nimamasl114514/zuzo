name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    # 当前实现依赖 Windows 专有的 CFFI 加载路径（wchar_t）与浏览器内置，
    # 因此 CI 跑在 windows-latest；Linux 移植见 docs/dev-status.md 路线图。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 构建
        run: go build -o zuzo.exe ./

      - name: Go 单测
        run: go test ./...

      - name: 格式检查
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: Python 语义对拍
        shell: bash
        run: |
          python --version
          ./run_tests.sh

      - name: 混合语言 golden
        shell: bash
        run: ./run_tests_mix.sh
